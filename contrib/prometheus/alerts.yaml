# unifand alerting rules — plain Prometheus / prometheus-operator PrometheusRule
# body / VictoriaMetrics VMRule body (the `groups:` shape below is identical
# across all three; wrap it in the CRD envelope your operator expects, e.g.:
#
#   apiVersion: monitoring.coreos.com/v1
#   kind: PrometheusRule
#   metadata:
#     name: unifand
#     namespace: unifand
#     labels: {release: kube-prometheus-stack}   # match your operator's ruleSelector
#   spec:
#     <paste groups: below>
#
#   apiVersion: operator.victoriametrics.com/v1beta1
#   kind: VMRule
#   metadata:
#     name: unifand
#     namespace: unifand
#   spec:
#     <paste groups: below>
#
# For a standalone Prometheus, drop this file (as-is) into a `rule_files:`
# path referenced from prometheus.yml.
#
# Metric names/labels verified against src/metrics.rs at unifand v0.4.0:
# unifand_build_info{version}, unifand_last_tick_timestamp_seconds,
# unifand_hub_present, unifand_degraded, unifand_fallback_active,
# unifand_hid_errors_total{kind="read"|"write"}.
# Multi-signal fusion metrics (only emitted with [signals] enabled = true),
# verified against src/metrics.rs on the feat/multi-signal branch:
# unifand_throttle_active{reason="sw_thermal"|"hw_thermal"|"hw_power_brake"|"sw_power_cap"},
# unifand_signal_errors_total{signal}.
groups:
  - name: unifand
    rules:
      - alert: UnifandAbsent
        expr: absent(unifand_build_info)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "unifand is not being scraped"
          description: >-
            No unifand_build_info series has been seen for 5 minutes.
            absent() carries no labels from the missing series, so this
            fires with no per-instance identity — check every configured
            target. Either the scrape target is gone (pod crashed/evicted,
            DaemonSet not scheduled) or the scrape config itself is
            broken. Check `kubectl get pods -n unifand` and the
            DaemonSet's node scheduling (see README Troubleshooting: "0/0
            DaemonSet, nodeSelector mismatch").

      - alert: UnifandStuck
        expr: time() - unifand_last_tick_timestamp_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "unifand control loop is stuck on {{ $labels.instance }}"
          description: >-
            unifand_last_tick_timestamp_seconds has not advanced in over 60s.
            The metrics HTTP thread is independent of the control loop, so
            this is the only reliable signal that the loop itself is wedged
            (a hung HID read/write, a deadlock, or similar) — /metrics can
            keep serving stale-but-plausible numbers forever otherwise. The
            DaemonSet's /healthz livenessProbe uses the same signal (3x
            poll_interval_secs) and should already be restarting the pod;
            if this alert is firing continuously, the restart isn't
            recovering — check `kubectl logs` for a crash loop.

      - alert: UnifandHubMissing
        expr: unifand_hub_present == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "unifand hub not found on {{ $labels.instance }}"
          description: >-
            unifand_hub_present has been 0 for 5 minutes. The daemon is
            running and waiting (this is expected, not a crash, as of
            v0.4.0) but no SL V2 hub has been found at /dev/hidraw*. Check
            that the hub is plugged into this node, the USB ID is
            0cf2:a105, and (if using the nfd-usb overlay) that the NFD
            label hasn't drifted after a hub swap.

      - alert: UnifandDegraded
        expr: unifand_degraded == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "unifand running without a GPU sensor on {{ $labels.instance }}"
          description: >-
            unifand_degraded has been 1 for 15 minutes: the GPU (NVML)
            sensor is unavailable and the daemon is controlling fans from
            CPU temperature alone. This is expected/permanent on CPU-only
            nodes and on arm64 (no NVML, typically no k10temp — see README
            Limitations); on a node that should have a working GPU sensor,
            this indicates a driver/toolkit problem.

      - alert: UnifandFallbackActive
        expr: unifand_fallback_active == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "unifand has lost all sensors on {{ $labels.instance }}"
          description: >-
            unifand_fallback_active has been 1 for 5 minutes: every
            temperature sensor is unavailable and the daemon is holding
            fallback_duty as a safety measure. Fans are running at a fixed
            duty with no thermal feedback loop. This is the single most
            alertable failure condition the daemon exposes — investigate
            immediately.

      - alert: UnifandHidWriteErrors
        expr: rate(unifand_hid_errors_total{kind="write"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "unifand duty writes are failing on {{ $labels.instance }}"
          description: >-
            unifand_hid_errors_total{kind="write"} has been increasing for
            10 minutes. Duty-write failures are a control-safety concern
            (fan speed may be stuck at whatever was last successfully
            commanded), distinct from kind="read" (RPM read-back loss,
            observability only). Sustained failures usually mean the hub
            needs a re-enumeration cycle or a physical USB reseat.

      # Fan-stall detection: RPM read-back exists precisely so a dead or
      # wedged fan is observable — this rule closes the loop. Both metrics
      # carry the same label set (channel + scrape labels), so the bare
      # `and` matches one-to-one per channel: alert when a channel is being
      # commanded meaningful duty but its fans report (near-)zero RPM.
      # Note: a channel with no fans connected reads 0 rpm permanently —
      # only list populated channels in `channels = [...]`, or silence the
      # alert for known-empty channels.
      - alert: UnifandFanStalled
        expr: unifand_fan_rpm < 100 and unifand_duty_percent > 30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "fan channel {{ $labels.channel }} appears stalled"
          description: >-
            Channel {{ $labels.channel }} has been commanded above 30% duty
            but reports under 100 rpm for 2 minutes. The fan may be stalled,
            unplugged, or the hub may be ignoring commands while still
            answering RPM reads. Check airflow immediately — the daemon
            believes it is cooling.

      # Multi-signal fusion ([signals] enabled = true): sustained thermal
      # throttling. The throttle floor is a safety net, not a routine path
      # (no thermal throttle bit was ever observed asserting on the
      # reference card, even at 84 C with 5 C of headroom) — so any of
      # these bits held for minutes means cooling is genuinely failing to
      # keep up. sw_power_cap is deliberately NOT matched: it asserts
      # continuously under any sustained load (measured 0x4 throughout,
      # 0x0 at idle) and is normal, not a thermal event.
      - alert: UnifandThermalThrottle
        expr: unifand_throttle_active{reason=~"sw_thermal|hw_thermal|hw_power_brake"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GPU thermally throttling ({{ $labels.reason }}) on {{ $labels.instance }}"
          description: >-
            unifand_throttle_active{reason="{{ $labels.reason }}"} has been
            1 for 5 minutes: the GPU (or, via sw_thermal, its memory — the
            only memory-overtemp signal consumer cards expose) is
            protecting itself by throttling despite the fans. If
            [signals.throttle] is enabled the duty floor is already
            holding fans at floor_duty (check
            unifand_throttle_floor_active); either way, sustained
            throttling means airflow, curve tuning, or case cooling is
            insufficient for the load.

      # Multi-signal fusion: a sensor that should work is failing
      # repeatedly. NotSupported is never counted (an absent signal is
      # normal and emits no series at all) — this counter only moves on
      # real read failures, so any sustained rate is a driver/NVML problem
      # worth investigating. The signal="throttle" series covers the
      # throttle-reason read that feeds the duty floor and the alarm
      # ladder's near-limit rung.
      - alert: UnifandSignalErrors
        expr: rate(unifand_signal_errors_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "unifand signal reads failing ({{ $labels.signal }}) on {{ $labels.instance }}"
          description: >-
            unifand_signal_errors_total{signal="{{ $labels.signal }}"} has
            been increasing for 10 minutes. This is a real, repeated read
            failure — not an unsupported sensor, which is silently absent
            instead. Fusion degrades gracefully (the failing signal simply
            stops producing a candidate duty and the remaining signals
            keep control), but the daemon is flying with one less input;
            check NVML/driver health on the node.
