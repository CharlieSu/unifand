[package]
name = "unifand"
version = "0.6.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "GPU-led fan-curve daemon for the Lian Li UNI HUB SL V2"
repository = "https://github.com/CharlieSu/unifand"
homepage = "https://github.com/CharlieSu/unifand"
keywords = ["fan-control", "kubernetes", "lian-li", "thermal", "homelab"]
categories = ["hardware-support"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1.0"
libc = "0.2"
nvml-wrapper = "0.12"
tiny_http = "0.12"
signal-hook = "0.4"
log = "0.4"
env_logger = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
