name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # release-please dispatches this workflow at the release tag ref (see
  # release-please.yaml) because GITHUB_TOKEN-created tags never fire the
  # tags trigger above. The tag-gated jobs key on github.ref either way.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/unifand
  DEPLOY_ARTIFACT: ghcr.io/${{ github.repository_owner }}/unifand-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1 (master; no versioned releases, pinned by commit)
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (2.9.2)
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  audit:
    # RustSec advisories + license/bans policy (deny.toml). No packages perms needed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check

  image:
    # Multi-arch container image: BUILT on every PR and main push (so
    # Dockerfile and docker-action changes are actually exercised before
    # merge, and main builds keep the default-branch GHA cache warm — the
    # only cache scope tag runs are allowed to read), PUSHED to GHCR only
    # on version tags. Cross-compilation keeps this at native build speed.
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No QEMU: the builder cross-compiles on the runner's native arch and
      # the runtime stage is COPY-only, so no target-arch code ever runs.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-artifact:
    # Kustomize manifests as a Flux-compatible OCI artifact on version tags.
    # Waits on `image` too so the artifact can pin the workload image by the
    # digest that job just pushed, not by a mutable tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin image version in the artifact
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cd deploy/base
          kustomize edit set image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unifand:${GITHUB_REF_NAME}@${DIGEST}"
      - name: Push manifests
        run: |
          # OCI references must be lowercase; repository_owner may not be.
          DEPLOY_ARTIFACT="${DEPLOY_ARTIFACT,,}"
          flux push artifact "oci://${DEPLOY_ARTIFACT}:${GITHUB_REF_NAME}" \
            --path=deploy \
            --source="${{ github.repositoryUrl }}" \
            --revision="${GITHUB_REF_NAME}/${GITHUB_SHA}"
          flux tag artifact "oci://${DEPLOY_ARTIFACT}:${GITHUB_REF_NAME}" --tag latest
