---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: unifand
  namespace: unifand
spec:
  template:
    spec:
      runtimeClassName: nvidia
      containers:
        - name: unifand
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "utility"
